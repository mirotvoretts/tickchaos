[package]
name = "tickchaos"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Protocol-aware UDP degradation proxy for testing market-data feed handlers against packet loss, reorder, duplication, jitter and sequence-number gaps"
license = "MIT"
repository = "https://github.com/mirotvoretts/tickchaos"
homepage = "https://github.com/mirotvoretts/tickchaos"
documentation = "https://docs.rs/tickchaos"
readme = "README.md"
keywords = ["udp", "proxy", "chaos-engineering", "market-data", "testing"]
categories = ["network-programming", "development-tools::testing", "simulation"]
exclude = ["assets/", "docs/", ".github/", "githooks/"]

[lib]
name = "tickchaos"
path = "src/lib.rs"

[[bin]]
name = "tickchaos"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync", "signal", "io-util"] }
socket2 = { version = "0.5", features = ["all"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["time"] }
futures = "0.3"
axum = "0.7"
arc-swap = "1"
serde_json = "1.0.151"

[dev-dependencies]
criterion = "0.8"
proptest = "1"
serde_json = "1.0.151"

[[bench]]
name = "operators"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = false

[profile.dev]
overflow-checks = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
